apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: your-registry/bff:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx128m"
            - name: ERP_MONOLITH_URL
              value: "http://erp-svc:8085"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-redis
                  key: redis-password
            - name: REDIS_SENTINEL_HOST
              value: "erp-redis-sentinel"
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: bff-jwt-secret
                  key: access-secret
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: default
spec:
  selector:
    app: bff
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bff-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bff
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70