services:
  postgres-test:
    image: postgres:16-alpine
    container_name: erp-postgres-test
    environment:
      POSTGRES_DB: erp_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  elasticsearch-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: erp-elasticsearch-test
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    ulimits:
      memlock:
        soft: -1
        hard: -1

  rabbitmq-test:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: erp_test
      RABBITMQ_DEFAULT_PASS: erp_test
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
