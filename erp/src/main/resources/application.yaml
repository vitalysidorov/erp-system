spring:
  application:
    name: erp
    inventory:
      default-markup: ${INVENTORY_DEFAULT_MARKUP:1.3}
      min-limit: ${INVENTORY_MIN_LIMIT:5}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:erp-rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:erp_user}
    password: ${RABBITMQ_PASSWORD}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  infrastructure:
    datasource:
      master:
        url: jdbc:postgresql://erp-postgres-cluster-rw:5432/erp_db
        username: erp_user
        password: ${PG_PASSWORD}
      replica:
        url: jdbc:postgresql://erp-postgres-cluster-ro:5432/erp_db
        username: erp_user
        password: ${PG_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
        order_inserts: true
        order_updates: true

  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:3600000}

  data:
    redis:
      password: ${REDIS_PASSWORD:redis_password}
      ssl:
        enabled: true
      sentinel:
        master: erp-redis-master
        nodes:
          - erp-redis-sentinel:26379

  elasticsearch:
    uris: https://erp-elastic-es-http:9200
    username: elastic
    password: ${ELASTIC_PASSWORD}
    connection-timeout: 5s
    socket-timeout: 10s

server:
  port: 8085
  shutdown: graceful
  netty:
    connection-timeout: 5000

jwt:
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
  group-configs:
    - group: orders-module
      paths-to-match:
        - /api/v1/work-orders/**
        - /api/v1/bookings/**
        - /api/v1/mechanic/**
    - group: inventory-module
      paths-to-match:
        - /api/v1/inventory/**
        - /api/v1/inventory/search
    - group: crm-module
      paths-to-match:
        - /api/v1/crm/**
    - group: finance-module
      paths-to-match:
        - /api/v1/analytics/**
    - group: employee-module
      paths-to-match:
        - /api/v1/auth
        - /api/v1/employees

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
