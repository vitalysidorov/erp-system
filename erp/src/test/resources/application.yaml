spring:
  application:
    name: erp-test
    inventory:
      default-markup: ${INVENTORY_DEFAULT_MARKUP:1.3}
      min-limit: ${INVENTORY_MIN_LIMIT:5}
  infrastructure:
    datasource:
      master:
        url: ${TEST_DB_URL:jdbc:postgresql://localhost:5434/postgres}
        username: ${TEST_DB_USERNAME:postgres}
        password: ${TEST_DB_PASSWORD:root}
      replica:
        url: ${TEST_DB_URL:jdbc:postgresql://localhost:5434/postgres} # в тестах реплика смотрит туда же
        username: ${TEST_DB_USERNAME:postgres}
        password: ${TEST_DB_PASSWORD:root}
  elasticsearch:
    uris: http://localhost:9201
    username: elastic
    password: ${ELASTIC_TEST_PASSWORD:test_password}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  liquibase:
    enabled: false
  rabbitmq:
    listener:
      direct:
        auto-startup: false
      simple:
        auto-startup: false
  cache:
    type: none # отключает кэширование через Redis для изоляции тестов
  data:
    redis:
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false
  # глобальное отключение автоконфигураций инфраструктурных клиентов
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt:
  access-secret: "test_secret_key_test_secret_key_test_secret_key_at_least_256_bits"
  refresh-secret: "test_refresh_key_test_refresh_key_test_refresh_key_at_least_256_bits"
  access-expiration: 60000
  refresh-expiration: 600000

server:
  port: 0

logging:
  level:
    root: INFO
    org.springframework.web: INFO